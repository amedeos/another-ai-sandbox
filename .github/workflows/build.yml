name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman

      - name: Build base image
        run: |
          podman build \
            --format docker \
            --tag localhost/agent-base:latest \
            --file base/Containerfile \
            base/

      - name: Build claude-code image
        run: |
          podman build \
            --format docker \
            --tag localhost/agent-claude:latest \
            --file claude-code/Containerfile \
            claude-code/

      - name: Build codex image
        run: |
          podman build \
            --format docker \
            --tag localhost/agent-codex:latest \
            --file codex/Containerfile \
            codex/

      - name: Build cursor-agent image
        run: |
          podman build \
            --format docker \
            --tag localhost/agent-cursor:latest \
            --file cursor-agent/Containerfile \
            cursor-agent/

      - name: Build opencode image
        run: |
          podman build \
            --format docker \
            --tag localhost/agent-opencode:latest \
            --file opencode/Containerfile \
            opencode/

      - name: Smoke test – zellij in the base image
        run: |
          podman run --rm --entrypoint zellij \
            localhost/agent-base:latest --version

      # A keybinds block that does not parse is silent at runtime: zellij falls
      # back to its defaults, and Ctrl+G (and Ctrl+O, Ctrl+T, …) go back to
      # being swallowed before the agent sees them. Let zellij read its own
      # config here, where a typo is cheap to notice.
      - name: Smoke test – zellij config parses
        run: |
          # Inside the image, not in the checkout: a COPY that stopped happening
          # is exactly the failure this is here for, and base/zellij.kdl would
          # match regardless. `|| status=$?` because the job shell is `bash -e`,
          # which would otherwise abort before the output could be printed.
          status=0
          out=$(podman run --rm --entrypoint zellij \
            localhost/agent-base:latest setup --check 2>&1) || status=$?
          echo "$out"
          [ "$status" -eq 0 ]
          ! grep -qiE 'error|failed to' <<<"$out"
          podman run --rm --entrypoint grep localhost/agent-base:latest \
            -q 'default_mode "locked"' /etc/zellij/config.kdl

      # Claude Code's Ctrl+G opens the prompt in $EDITOR, so the editor and the
      # variables that point at it are both part of the image's contract.
      - name: Smoke test – editor for Ctrl+G
        run: |
          # No pipe: the job shell has no pipefail, so `podman | head` would
          # report head's success and a missing vim would pass unnoticed.
          ver=$(podman run --rm --entrypoint vim \
            localhost/agent-base:latest --version)
          echo "${ver%%$'\n'*}"
          out=$(podman run --rm --entrypoint printenv \
            localhost/agent-base:latest EDITOR VISUAL | tr '\n' ' ')
          [[ "$out" == "vim vim " ]]

      # uv's two image defaults are as much a part of the contract as EDITOR:
      # on a tmpfs cache next to a bind-mounted project, losing UV_LINK_MODE
      # brings back a hardlink warning on every install, and losing
      # UV_PYTHON_PREFERENCE lets a tmpfs-resident interpreter outrank the
      # image's own.
      - name: Smoke test – uv in the base image
        run: |
          podman run --rm --entrypoint uv \
            localhost/agent-base:latest --version
          out=$(podman run --rm --entrypoint printenv \
            localhost/agent-base:latest \
            UV_LINK_MODE UV_PYTHON_PREFERENCE | tr '\n' ' ')
          [[ "$out" == "copy system " ]]

      # With AI_SANDBOX_WEB unset the supervisor must be a transparent exec,
      # which is what keeps non-web sessions unchanged.
      - name: Smoke test – supervisor passthrough
        run: |
          out=$(podman run --rm \
            --entrypoint /usr/local/bin/ai-sandbox-supervise \
            localhost/agent-base:latest echo passthrough-ok)
          [[ "$out" == "passthrough-ok" ]]

      # PrusaSlicer is opt-in, so the default build above must not carry it,
      # and the label ai-sandbox-build reads to keep the choice must say so.
      # `|| echo absent` rather than `if ! …`: a podman that fails to run at
      # all must fail the step, not read as "not installed".
      - name: Smoke test – PrusaSlicer absent by default
        run: |
          out=$(podman run --rm --entrypoint sh localhost/agent-base:latest \
            -c 'command -v prusa-slicer || echo absent')
          [[ "$out" == "absent" ]]
          label=$(podman image inspect \
            --format '{{index .Config.Labels "ai-sandbox.prusaslicer"}}' \
            localhost/agent-base:latest)
          [[ "$label" == "0" ]]

      # Same Containerfile, under its own tag so the agent images above stay on
      # the default build; the package layer comes from the cache.
      - name: Build base image with PrusaSlicer
        run: |
          podman build \
            --format docker \
            --build-arg WITH_PRUSASLICER=1 \
            --tag localhost/agent-base:prusaslicer \
            --file base/Containerfile \
            base/
          label=$(podman image inspect \
            --format '{{index .Config.Labels "ai-sandbox.prusaslicer"}}' \
            localhost/agent-base:prusaslicer)
          [[ "$label" == "1" ]]

      # A real slice, not --help: the package layer removes GL/X11 libraries
      # PrusaSlicer links against, and only running it shows that its own layer
      # brought them back.  Run with the hardening, limits and tmpfs mounts of
      # an ai-sandbox session (its defaults: 4g, 512 pids, 1g /tmp and
      # /home/agent), with no network and no display, which is how an agent
      # will run it.  The cube is generated here and fed on stdin, so nothing
      # is bind-mounted.  The default config writes text G-code; a real Prusa
      # profile (binary_gcode = 1) would write .bgcode instead.
      - name: Smoke test – PrusaSlicer headless slice
        run: |
          python3 -I - "$RUNNER_TEMP/cube.stl" <<'EOF'
          import sys
          s = 20.0
          out = ["solid cube"]
          for a in range(3):
              b, c = (a + 1) % 3, (a + 2) % 3
              for d in (0.0, s):
                  quad = []
                  for u, w in ((0, 0), (s, 0), (s, s), (0, s)):
                      p = [0.0] * 3
                      p[a], p[b], p[c] = d, u, w
                      quad.append(p)
                  if d == 0.0:
                      quad.reverse()
                  for tri in ((quad[0], quad[1], quad[2]), (quad[0], quad[2], quad[3])):
                      out += ["facet normal 0 0 0", " outer loop"]
                      out += ["  vertex %g %g %g" % tuple(p) for p in tri]
                      out += [" endloop", "endfacet"]
          out.append("endsolid cube")
          with open(sys.argv[1], "w") as f:
              f.write("\n".join(out) + "\n")
          EOF
          status=0
          out=$(podman run --rm -i \
            --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --memory=4g --pids-limit=512 \
            --tmpfs /tmp:rw,size=1g \
            --mount type=tmpfs,destination=/home/agent,tmpfs-size=1g,tmpfs-mode=0755,U=true \
            --network=none --user 1000:1000 \
            --entrypoint bash localhost/agent-base:prusaslicer -c '
              set -euo pipefail
              cat > /tmp/cube.stl
              prusa-slicer --export-gcode --output /tmp/cube.gcode /tmp/cube.stl
              moves=$(grep -c "^G1 " /tmp/cube.gcode)
              echo "G1 moves: ${moves}"
            ' < "$RUNNER_TEMP/cube.stl" 2>&1) || status=$?
          echo "$out"
          [ "$status" -eq 0 ]

      - name: Smoke test – claude
        run: podman run --rm localhost/agent-claude:latest --version

      - name: Smoke test – codex
        run: podman run --rm localhost/agent-codex:latest --version

      - name: Smoke test – cursor-agent
        run: podman run --rm localhost/agent-cursor:latest --version

      - name: Smoke test – opencode
        run: podman run --rm localhost/agent-opencode:latest --version

      - name: List built images
        run: podman images | grep -E 'agent-'
