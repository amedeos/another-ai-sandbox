name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman

      - name: Build base image
        run: |
          podman build \
            --format docker \
            --tag localhost/agent-base:latest \
            --file base/Containerfile \
            base/

      - name: Build claude-code image
        run: |
          podman build \
            --format docker \
            --tag localhost/agent-claude:latest \
            --file claude-code/Containerfile \
            claude-code/

      - name: Build codex image
        run: |
          podman build \
            --format docker \
            --tag localhost/agent-codex:latest \
            --file codex/Containerfile \
            codex/

      - name: Build cursor-agent image
        run: |
          podman build \
            --format docker \
            --tag localhost/agent-cursor:latest \
            --file cursor-agent/Containerfile \
            cursor-agent/

      - name: Build opencode image
        run: |
          podman build \
            --format docker \
            --tag localhost/agent-opencode:latest \
            --file opencode/Containerfile \
            opencode/

      - name: Smoke test – zellij in the base image
        run: |
          podman run --rm --entrypoint zellij \
            localhost/agent-base:latest --version

      # A keybinds block that does not parse is silent at runtime: zellij falls
      # back to its defaults, and Ctrl+G (and Ctrl+O, Ctrl+T, …) go back to
      # being swallowed before the agent sees them. Let zellij read its own
      # config here, where a typo is cheap to notice.
      - name: Smoke test – zellij config parses
        run: |
          # Inside the image, not in the checkout: a COPY that stopped happening
          # is exactly the failure this is here for, and base/zellij.kdl would
          # match regardless. `|| status=$?` because the job shell is `bash -e`,
          # which would otherwise abort before the output could be printed.
          status=0
          out=$(podman run --rm --entrypoint zellij \
            localhost/agent-base:latest setup --check 2>&1) || status=$?
          echo "$out"
          [ "$status" -eq 0 ]
          ! grep -qiE 'error|failed to' <<<"$out"
          podman run --rm --entrypoint grep localhost/agent-base:latest \
            -q 'default_mode "locked"' /etc/zellij/config.kdl

      # Claude Code's Ctrl+G opens the prompt in $EDITOR, so the editor and the
      # variables that point at it are both part of the image's contract.
      - name: Smoke test – editor for Ctrl+G
        run: |
          # No pipe: the job shell has no pipefail, so `podman | head` would
          # report head's success and a missing vim would pass unnoticed.
          ver=$(podman run --rm --entrypoint vim \
            localhost/agent-base:latest --version)
          echo "${ver%%$'\n'*}"
          out=$(podman run --rm --entrypoint printenv \
            localhost/agent-base:latest EDITOR VISUAL | tr '\n' ' ')
          [[ "$out" == "vim vim " ]]

      # uv's two image defaults are as much a part of the contract as EDITOR:
      # on a tmpfs cache next to a bind-mounted project, losing UV_LINK_MODE
      # brings back a hardlink warning on every install, and losing
      # UV_PYTHON_PREFERENCE lets a tmpfs-resident interpreter outrank the
      # image's own.
      - name: Smoke test – uv in the base image
        run: |
          podman run --rm --entrypoint uv \
            localhost/agent-base:latest --version
          out=$(podman run --rm --entrypoint printenv \
            localhost/agent-base:latest \
            UV_LINK_MODE UV_PYTHON_PREFERENCE | tr '\n' ' ')
          [[ "$out" == "copy system " ]]

      # With AI_SANDBOX_WEB unset the supervisor must be a transparent exec,
      # which is what keeps non-web sessions unchanged.
      - name: Smoke test – supervisor passthrough
        run: |
          out=$(podman run --rm \
            --entrypoint /usr/local/bin/ai-sandbox-supervise \
            localhost/agent-base:latest echo passthrough-ok)
          [[ "$out" == "passthrough-ok" ]]

      - name: Smoke test – claude
        run: podman run --rm localhost/agent-claude:latest --version

      - name: Smoke test – codex
        run: podman run --rm localhost/agent-codex:latest --version

      - name: Smoke test – cursor-agent
        run: podman run --rm localhost/agent-cursor:latest --version

      - name: Smoke test – opencode
        run: podman run --rm localhost/agent-opencode:latest --version

      - name: List built images
        run: podman images | grep -E 'agent-'
