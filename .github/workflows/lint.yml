name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          shopt -s globstar nullglob
          files=()
          for f in **/*.sh **/*.bash; do
            files+=("$f")
          done
          for f in ai-sandbox ai-sandbox-build base/ai-sandbox-supervise; do
            [[ -f "$f" ]] && files+=("$f")
          done
          if [[ ${#files[@]} -gt 0 ]]; then
            shellcheck --format=gcc "${files[@]}"
          fi

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ai-sandbox-web and ai-sandbox-login-relay have no extension, so
      # ShellCheck's glob does not pick them up; they are Python and must not
      # be linted as shell.
      - name: Byte-compile the dashboard and the sign-in relay
        run: python -m py_compile web/ai-sandbox-web ai-sandbox-login-relay

      - name: Ruff
        run: pipx run ruff check --target-version py39 web/ai-sandbox-web ai-sandbox-login-relay

      # Needs neither podman nor Codex: a fake podman and a fake login server
      # stand in for the container.
      - name: Codex sign-in relay
        run: bash test/test_login_relay.sh

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Containerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: base/Containerfile

      - name: Lint claude-code/Containerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: claude-code/Containerfile

      - name: Lint codex/Containerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: codex/Containerfile

      - name: Lint cursor-agent/Containerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: cursor-agent/Containerfile

      - name: Lint opencode/Containerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: opencode/Containerfile
